[package]
name = "repslog"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/argent0/repslog"
homepage = "https://github.com/argent0/repslog"

[dependencies]
clap = { version = "4.4", features = ["derive", "env", "string"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "macros", "json"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comfy-table = "7.1"
colored = "2.1"
tracing = "0.1"
tracing-subscriber = "0.3"
atty = "0.2"
fitparser = "0.11"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"

[build-dependencies]
# None needed for now
